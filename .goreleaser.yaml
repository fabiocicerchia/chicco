# GoReleaser builds the cross-platform binaries, generates an SBOM per archive
# (syft), and keyless-signs the checksums file with cosign using the GitHub
# Actions OIDC token — no long-lived keys. See .github/workflows/release.yml.
version: 2

project_name: chicco

before:
  hooks:
    - go mod tidy

builds:
  - id: chicco
    main: ./cmd/chicco
    binary: chicco
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: chicco
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - chicco.yaml
      - src: man/*.1
        dst: man

# The OS packages. One binary, one man page, the licence and the readme — laid
# out where a packager expects them rather than in a tarball to unpack. Only the
# linux builds are packaged; nfpm has nothing to say about darwin or windows.
nfpms:
  - id: chicco
    package_name: chicco
    vendor: Fabio Cicerchia
    homepage: https://github.com/fabiocicerchia/chicco
    maintainer: Fabio Cicerchia <info@fabiocicerchia.it>
    description: Local OpenAI- and Anthropic-compatible rotation proxy
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    section: utils
    contents:
      - src: man/chicco.1
        dst: /usr/share/man/man1/chicco.1
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/chicco/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/chicco/README.md
        file_info:
          mode: 0644
      - src: chicco.yaml
        dst: /usr/share/doc/chicco/chicco.yaml.example
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

# One SBOM (SPDX JSON) per release archive.
sboms:
  - artifacts: archive

# Keyless cosign signature over checksums.txt — verifying the checksum then
# verifies every artifact it lists.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: fabiocicerchia
    name: chicco
  # Created unpublished so the workflow can attach assets to it: immutable
  # releases reject uploads once a release is published. The workflow flips it
  # to published as its last step.
  draft: true
  prerelease: auto
  footer: |
    ## Verify the download

    ```sh
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/fabiocicerchia/chicco' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```
