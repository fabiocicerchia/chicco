# GoReleaser builds the cross-platform binaries, generates an SBOM per archive
# (syft), and keyless-signs the checksums file with cosign using the GitHub
# Actions OIDC token — no long-lived keys. See .github/workflows/release.yml.
version: 2

project_name: chicco

before:
  hooks:
    - go mod tidy

builds:
  - id: chicco
    main: ./cmd/chicco
    binary: chicco
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: chicco
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - chicco.yaml
      - src: man/*.1
        dst: man

# The OS packages. One binary, one man page, the licence and the readme — laid
# out where a packager expects them rather than in a tarball to unpack. Only the
# linux builds are packaged; nfpm has nothing to say about darwin or windows.
nfpms:
  - id: chicco
    package_name: chicco
    vendor: Fabio Cicerchia
    homepage: https://github.com/fabiocicerchia/chicco
    maintainer: Fabio Cicerchia <info@fabiocicerchia.it>
    description: Local OpenAI- and Anthropic-compatible rotation proxy
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    section: utils
    contents:
      - src: man/chicco.1
        dst: /usr/share/man/man1/chicco.1
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/chicco/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/chicco/README.md
        file_info:
          mode: 0644
      - src: chicco.yaml
        dst: /usr/share/doc/chicco/chicco.yaml.example
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

# One SBOM (SPDX JSON) per release archive.
sboms:
  - artifacts: archive

# Keyless cosign signature over checksums.txt — verifying the checksum then
# verifies every artifact it lists. cosign v3 emits a Sigstore bundle, which
# carries the signature and the signing certificate in a single file; the old
# --output-signature/--output-certificate pair is ignored under that format.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# The Homebrew cask, published to fabiocicerchia/homebrew-tap on release:
#
#   brew install fabiocicerchia/tap/chicco
#
# A cask, not a formula: homebrew-core requires formulae to build from source,
# and these are prebuilt binaries. Casks are macOS-only — Linux users install
# the deb/rpm/apk above.
homebrew_casks:
  - name: chicco
    binaries: [chicco]
    # With the release pipe disabled goreleaser cannot derive this, and
    # refuses rather than guessing.
    url:
      template: "https://github.com/fabiocicerchia/chicco/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    manpages: [man/chicco.1]
    homepage: https://github.com/fabiocicerchia/chicco
    description: Local OpenAI- and Anthropic-compatible rotation proxy
    repository:
      owner: fabiocicerchia
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Build the cask always, push it only when the tap token is present, so a
    # release does not fail on a secret that has not been added yet.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    # This binary is not notarized, so Gatekeeper quarantines it on download.
    # GoReleaser documents stripping the quarantine flag in a post-install hook;
    # that is a deliberate bypass of a macOS security control, so it is not done
    # here — the user is told instead. Notarizing (an Apple Developer account)
    # is the fix that removes this note.
    caveats: |
      macOS quarantines binaries it cannot verify. On first run:
        xattr -d com.apple.quarantine "$(brew --prefix)/bin/chicco"

release:
  # release-please already created the release for this tag; this run only
  # builds, attaches and publishes the cask. Leaving the pipe on would have
  # goreleaser try to create it a second time.
  disable: true
  github:
    owner: fabiocicerchia
    name: chicco
  prerelease: auto
