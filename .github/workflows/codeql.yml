name: codeql

on:
  # No push trigger: the pull request already ran this on the identical
  # tree. What a merge cannot tell you, the schedule below can.
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 7 * * 1'   # weekly, Monday 07:40 UTC

# Read-only by default; the analysis job elevates only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the code-scanning dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
