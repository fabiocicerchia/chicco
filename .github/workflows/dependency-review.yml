# Managed centrally — edit the shared config, not this copy.
name: dependency-review

# Blocks PRs that introduce dependencies with known vulnerabilities or
# incompatible licenses. Requires GitHub's Dependency Graph (on by default
# for public repos; enable in Settings > Security for private repos).

on: pull_request

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # The action needs GitHub Advanced Security on a private repo. Guarding here
    # rather than omitting the file on the private tier: one workflow covers
    # both, and a skipped job reads as "not applicable" instead of failing red.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
