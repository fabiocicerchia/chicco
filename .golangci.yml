version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck      # unchecked errors
    - govet         # go vet
    - ineffassign   # ineffectual assignments
    - staticcheck   # broad correctness/style analysis
    - unused        # unused code
    - misspell      # common spelling mistakes
    - unconvert     # redundant type conversions
    - bodyclose     # HTTP response bodies are closed

    # House set (TOOLING.md). The rules above are kept as they were.
    - contextcheck      # FC-GO-009
    - errorlint         # FC-GO-005 - catches == on errors and missing %w
    - godox             # FC-GEN-010 - no TODO/FIXME/HACK markers
    - forbidigo         # FC-GEN-055 - blocks time.Now, os.Getenv outside the root
    - noctx             # FC-GEN-032
    - nilerr
    - errname
    - exhaustive
    - gocritic
    - revive
    - testifylint
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    staticcheck:
      # QF1002 (tagged-switch suggestion) is a style refactor, not a bug - leave
      # the switch-true forms as written.
      checks: ["all", "-QF1002"]
    errcheck:
      check-type-assertions: true
      check-blank: true         # FC-GO-007 - a discarded error must be explicit
    exhaustive:
      default-signifies-exhaustive: true
    godox:
      keywords: [TODO, FIXME, HACK, XXX]
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: "FC-GEN-055: inject a clock."
        - pattern: ^os\.Getenv$
          msg: "FC-GEN-055: read env once at startup into validated config."
    revive:
      rules:
        - name: exported        # FC-GEN-008
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: package-comments

  exclusions:
    presets:
      - std-error-handling   # restores the classic Close/Flush/Remove/print excludes (v1 default)
    rules:
      # Ignoring Write/Close return values in tests is noise, not a defect.
      - path: _test\.go
        linters: [errcheck, forbidigo]   # tests may freeze the clock directly
      - path: (^|/)(main|cmd)/
        linters: [forbidigo]             # composition root reads env and the clock

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fabiocicerchia/chicco
